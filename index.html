<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Under Maintenance</title>

<style>
:root{
  --accent:#f59e0b;
  --text:#0f172a;
  --muted:#64748b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg,#0ea5e9,#e0f2fe);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
  max-width:420px;
  width:90%;
}

h1{
  margin:0 0 8px 0;
  font-size:28px;
}

h1 span{
  color:var(--accent);
}

p{
  margin:0 0 12px 0;
  font-size:14px;
  color:var(--muted);
}

img{
  width:100%;
  max-width:320px;
  height:auto;
  margin-top:10px;
}

/* small animated line */
.bar{
  height:5px;
  background:#e2e8f0;
  border-radius:5px;
  overflow:hidden;
  margin-top:10px;
}

.bar::before{
  content:"";
  display:block;
  height:100%;
  width:30%;
  background:var(--accent);
  animation:move 1.2s infinite;
}

@keyframes move{
  from{transform:translateX(-100%);}
  to{transform:translateX(400%);}
}

.blink-warning{
  font-weight:bold;
  color:red;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%, 50%, 100% { opacity:1; }
  25%, 75% { opacity:0; }
}

</style>
</head>

<body>

<div class="box">

  <h1>Under <span>Maintenance</span></h1>

  <p>
    We are working on the website.<br>
    Please come back later.<br>
    <span class="blink-warning">MAY NEED TO HARD RESET AFTER WE ARE DONE, AND CEAR COOKIES  !!!!!<br>CTRL+SHIFT+R</span>
  </p>

  <div class="bar"></div>

  <!-- put maintenance.png in same folder -->
  <img src="maintenance.png" alt="Maintenance">

</div>

</body>
</html>
