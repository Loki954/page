<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="pinout.ddns.net has moved to www.loki954.com.">
  <title>We've Moved | pinout.ddns.net</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #223553 0%, #111827 45%, #090e19 100%); color: #f8fafc; }
    main { width: min(100%, 620px); text-align: center; padding: clamp(32px, 7vw, 64px) clamp(24px, 6vw, 56px); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: rgba(255,255,255,.045); box-shadow: 0 20px 70px rgba(0,0,0,.3); }
    .icon { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: rgba(96,165,250,.12); color: #93c5fd; font-size: 32px; margin-bottom: 18px; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.045em; margin: 0 0 16px; }
    p { font-size: 1.15rem; color: #cbd5e1; line-height: 1.65; margin: 0 auto 28px; }
    .old { color: #fff; font-weight: 600; white-space: nowrap; }
    .new { color: #93c5fd; font-weight: 650; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; overflow-wrap: anywhere; }
    .button { display: inline-block; padding: 14px 24px; border-radius: 12px; background: #60a5fa; color: #0b1220; text-decoration: none; font-weight: 750; transition: background .2s ease, transform .2s ease; }
    .button:hover { background: #93c5fd; transform: translateY(-2px); }
    .button:focus-visible, .new:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .note { margin: 28px 0 0; font-size: .88rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">&#8594;</div>
    <h1>We've Moved!</h1>
    <p><span class="old">pinout.ddns.net</span> has moved to <a class="new" href="https://www.loki954.com/">www.loki954.com</a>.</p>
    <a class="button" href="https://www.loki954.com/">Visit Loki954 &rarr;</a>
    <p class="note">Please update your bookmarks with our new address.</p>
  </main>
</body>
</html>
